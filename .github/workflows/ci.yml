name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.env.example'
            backend:
              - 'backend/**'

  check:
    name: Lint, Type Check & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TABLE_NAME: test-table
      ARCHIVE_BUCKET: test-archive-bucket
      USER_PROFILES_TABLE: test-profiles
      COMMENTS_TABLE: test-comments
      MESSAGES_TABLE: test-messages
      REACTIONS_TABLE: test-reactions
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup environment
        if: needs.changes.outputs.frontend == 'true'
        run: cp .env.example frontend/.env

      - name: Generate SvelteKit types
        if: needs.changes.outputs.frontend == 'true'
        run: cd frontend && npx svelte-kit sync

      - name: Lint (fail on warnings)
        if: needs.changes.outputs.frontend == 'true'
        run: cd frontend && npm run check:lint -- --max-warnings 0

      - name: Type check
        if: needs.changes.outputs.frontend == 'true'
        run: cd frontend && npm run check:types

      - name: Tests
        run: npm test -- --reporter=verbose

  knip:
    name: Knip (unused exports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    # Reports unused exports, types, and dependencies. Currently advisory
    # while pre-existing findings from Phases 1-5 are cleared. Flip
    # continue-on-error to false (and add to status-check needs) once knip
    # output is clean to make the gate enforcing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate SvelteKit types
        run: cd frontend && npx svelte-kit sync || true
      - name: Run knip
        run: npm run knip

  audit:
    name: npm audit (high+critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    # Fails on any high or critical vulnerability at the repo root or in
    # frontend/. Dependabot raises automatic PRs for upgrades; merge those
    # rather than disabling this gate. When an upstream fix is unavailable,
    # add an override in package.json with a CVE reference in
    # _securityNotes.resolved before re-running.
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit root
        run: npm audit --audit-level=high
      - name: Audit frontend
        run: cd frontend && npm audit --audit-level=high

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check, audit]
    if: always()
    steps:
      - name: Verify
        run: |
          results=("${{ needs.check.result }}" "${{ needs.audit.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "One or more checks failed: $result"
              exit 1
            fi
          done
          echo "All checks passed!"
