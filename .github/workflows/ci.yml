name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.env.example'
            backend:
              - 'backend/**'

  check:
    name: Lint, Type Check & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      TABLE_NAME: test-table
      ARCHIVE_BUCKET: test-archive-bucket
      USER_PROFILES_TABLE: test-profiles
      COMMENTS_TABLE: test-comments
      MESSAGES_TABLE: test-messages
      REACTIONS_TABLE: test-reactions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup environment
        if: needs.changes.outputs.frontend == 'true'
        run: cp .env.example frontend/.env

      - name: Generate SvelteKit types
        if: needs.changes.outputs.frontend == 'true'
        run: cd frontend && npx svelte-kit sync

      - name: Lint (fail on warnings)
        if: needs.changes.outputs.frontend == 'true'
        run: cd frontend && npm run check:lint -- --max-warnings 0

      - name: Type check
        if: needs.changes.outputs.frontend == 'true'
        run: cd frontend && npm run check:types

      - name: Tests
        run: npm test -- --reporter=verbose

  knip:
    name: Knip (unused exports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    # Reports unused exports, types, and dependencies. Currently advisory
    # while pre-existing findings from Phases 1-5 are cleared. Flip
    # continue-on-error to false (and add to status-check needs) once knip
    # output is clean to make the gate enforcing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate SvelteKit types
        run: cd frontend && npx svelte-kit sync || true
      - name: Run knip (advisory)
        # Exit 0 unconditionally while pre-existing findings from earlier
        # remediation phases are cleared. Drop `|| true` (and flip
        # continue-on-error above to false, plus add to status-check needs)
        # once knip output is clean to make this an enforcing gate.
        run: npm run knip || true

  audit:
    name: npm audit (high+critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    # Fails on any high or critical vulnerability at the repo root or in
    # frontend/. Dependabot raises automatic PRs for upgrades; merge those
    # rather than disabling this gate. When an upstream fix is unavailable,
    # add an override in package.json with a CVE reference in
    # _securityNotes.resolved before re-running.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit root
        run: npm audit --audit-level=high
      - name: Audit frontend
        run: cd frontend && npm audit --audit-level=high

  docs:
    name: Docs (markdownlint + lychee)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24.1.0
        with:
          globs: |
            **/*.md
            #node_modules
            #frontend/node_modules
      - name: Lychee link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --config .lychee.toml --no-progress "**/*.md"
          fail: true

  status-check:
    name: All Checks Passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check, audit, docs]
    if: always()
    steps:
      - name: Verify
        run: |
          results=("${{ needs.check.result }}" "${{ needs.audit.result }}" "${{ needs.docs.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "One or more checks failed: $result"
              exit 1
            fi
          done
          echo "All checks passed!"
