version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # remark-footnotes 5.0.0 is a deprecation tombstone, not a release: it is
      # 583 bytes with no main, no exports and no code, published only to point
      # at remark-gfm. Taking it silently removes footnote rendering and breaks
      # frontend/mdsvex.config.js at import time. Stay on 4.x until that config
      # is migrated to remark-gfm.
      - dependency-name: remark-footnotes
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  # frontend/ is an npm workspace of the root package.json and shares the root
  # package-lock.json. A separate /frontend entry here raises PRs that edit
  # frontend/package.json without ever touching the root lockfile, so `npm ci`
  # rejects them as out of sync. The `/` entry above already covers workspace
  # dependencies and updates the lockfile with them.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
