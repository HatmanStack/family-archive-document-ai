# Lychee link checker configuration.
# Runs against all .md files in CI; see .github/workflows/ci.yml.

# Network behavior
max_redirects = 5
max_concurrency = 8
timeout = 20
retry_wait_time = 2
accept = [200, 206, 429]

# Skip patterns
exclude_all_private = true
exclude = [
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://0\\.0\\.0\\.0",
  "^https?://.*\\.example\\.com",
  # Cognito hosted-UI placeholders used in docs.
  "amazoncognito\\.com",
  # AppSync / API Gateway placeholders.
  "execute-api\\..*\\.amazonaws\\.com",
  "appsync-api\\..*\\.amazonaws\\.com",
  # Public RAGStack quicklaunch template referenced from README/docs.
  "ragstack-quicklaunch-public",
  "hold-that-thought-quicklaunch-public",
]
